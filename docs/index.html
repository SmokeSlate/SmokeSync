<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmokeSync Builder (Google OAuth)</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{font-family:system-ui,sans-serif;background:#f4f4f8;color:#222;
display:flex;flex-direction:column;align-items:center;padding:2em;}
form{background:#fff;padding:1.5em 2em;border-radius:16px;
box-shadow:0 2px 10px rgba(0,0,0,.1);max-width:700px;width:100%;}
input,textarea{width:100%;padding:.6em;margin-top:.4em;
font-family:monospace;border:1px solid #ccc;border-radius:8px;}
textarea{min-height:120px;resize:vertical;}
button{margin-top:1.5em;width:100%;background:#4b8df8;color:#fff;
border:none;padding:.8em;border-radius:10px;font-size:1rem;cursor:pointer;}
button:hover{background:#357ae8;}
pre{background:#222;color:#eee;padding:1em;border-radius:10px;margin-top:1em;
white-space:pre-wrap;word-break:break-word;}
</style>
</head>
<body>
<h1>SmokeSync Builder (OAuth)</h1>

<div id="signin"></div>

<form id="builderForm" style="display:none;">
  <label style="display:none;">Apps Script URL:</label>
  <input style="display:none;" value="https://script.google.com/macros/s/AKfycbxAQr-3Di5yy6M_bwJFaZs9eHPgM9M7fMruneZa7v9ZeBkpO359BIEC9h7vBzgmrWWf/exec" type="url" id="scriptUrl" required
    placeholder="https://script.google.com/macros/s/AKfycb.../exec">

  <label>Username:</label>
  <input type="text" id="username" required>

  <label>Password:</label>
  <input type="password" id="password" required>

  <label>Runs JSON:</label>
  <textarea id="runs" required>
[
  {"playlistID":"45658","pages":5,"query":"&vivify=true"},
  {"playlistID":"12888","pages":5,"query":""},
  {"playlistID":"95878","pages":5}
]
  </textarea>

  <button type="submit">Create Script</button>
</form>
<pre id="output"></pre>

<script>
let accessToken = null;
let tokenClient = null;

// Initialize token client after GIS script loads
window.onload = () => {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: "664531342070-ikpu8q50f0ok5ajg74l0b7jg03gaiqgd.apps.googleusercontent.com",
    scope: "https://www.googleapis.com/auth/script.external_request https://www.googleapis.com/auth/script.projects https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/script.scriptapp https://www.googleapis.com/auth/userinfo.email",
    callback: (response) => {
      accessToken = response.access_token;
      document.getElementById("signin").style.display = "none";
      document.getElementById("builderForm").style.display = "block";
    }
  });

  document.getElementById("signin").onclick = () => {
    tokenClient.requestAccessToken();
  };
};

document.getElementById("builderForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = scriptUrl.value.trim();
  const payload = {
    username: username.value.trim(),
    password: password.value.trim(),
    runs: JSON.parse(runs.value)
  };
  output.textContent = "Sending request...";
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + accessToken
      },
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    output.textContent = text;
  } catch (err) {
    output.textContent = "Error: " + err.message;
  }
});
</script>
</body>
</html>
